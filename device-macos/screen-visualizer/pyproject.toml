[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-visualizer"
version = "0.1.0"
description = "Real-time visualization of AUSM screen-stream frames"
requires-python = ">=3.9"
dependencies = [
    "screen-stream-reader",
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
]

[project.scripts]
screen-visualizer = "screen_visualizer.visualizer:main"

[tool.setuptools.packages.find]
where = ["."]
