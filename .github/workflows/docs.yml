name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "skills/**", "scripts/sync-docs-skill.mjs", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "skills/**", "scripts/sync-docs-skill.mjs", ".github/workflows/docs.yml"]

jobs:
  skill-in-sync:
    name: Docs page matches SKILL.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-docs-skill.mjs --check
